name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-script:
    name: Setup script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint shell scripts
        run: shellcheck -x scripts/setup-railway.sh rootfs/usr/local/bin/entrypoint.sh test/*.sh test/fake-railway rootfs/etc/profile.d/devenv.sh
      - name: Test setup script against a fake Railway CLI
        run: test/setup-script-test.sh

  smoke-test:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the image and run all checks
        run: test/smoke-test.sh
