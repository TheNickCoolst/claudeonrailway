name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-script:
    name: Setup script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh rootfs/usr/local/bin/entrypoint.sh test/*.sh test/fake-railway rootfs/etc/profile.d/devenv.sh
      - name: Test setup script against a fake Railway CLI
        run: test/setup-script-test.sh

  smoke-test:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the image and run all checks
        run: test/smoke-test.sh

  # After the tests pass on main, publish the image to GitHub's container registry.
  # The Railway template deploys this image, so it needs no access to the (private) repo.
  publish-image:
    name: Publish image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [setup-script, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push ghcr.io/${{ github.repository }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:latest" -t "$image:${GITHUB_SHA::12}" .
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
          echo "Published $image:latest" >> "$GITHUB_STEP_SUMMARY"
