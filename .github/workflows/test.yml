name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-script:
    name: Setup script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh rootfs/usr/local/bin/entrypoint.sh test/*.sh test/fake-railway rootfs/etc/profile.d/devenv.sh
      - name: Test setup script against a fake Railway CLI
        run: test/setup-script-test.sh

  smoke-test:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the image and run all checks
        run: test/smoke-test.sh

  # After the tests pass on main, publish the image to GitHub's container registry.
  # The Railway template deploys this image, so it needs no access to the (private) repo.
  publish-image:
    name: Publish image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [setup-script, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push ghcr.io/${{ github.repository }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # --provenance=false: push a plain image manifest instead of an index with an
          # attestation. GitHub links a new package to this repo via the source label below,
          # and only a linked package may be created with the workflow's token.
          docker build --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:latest" -t "$image:${GITHUB_SHA::12}" .
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
          echo "Published $image:latest" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain a refused push
        if: failure()
        run: |
          {
            echo "### Pushing the image was refused"
            echo "If the log says \"denied\", the package probably exists without write access for this repo."
            echo "Fix: GitHub → your profile → Packages → ${GITHUB_REPOSITORY#*/} → Package settings →"
            echo "Manage Actions access → Add repository → ${GITHUB_REPOSITORY} with role Write. Then re-run this job."
          } >> "$GITHUB_STEP_SUMMARY"
